<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heracles Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-left">
        <p class="eyebrow">Heracles &bull; Editor</p>
        <h1 class="step-label" id="stepLabel">Loading session&hellip;</h1>
      </div>
      <div class="topbar-actions">
        <div class="control-cluster">
          <button class="icon-button" id="undoButton" type="button" title="Undo (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h9.5A6.5 6.5 0 0 1 20 15.5V17"></path></svg>
          </button>
          <button class="icon-button" id="redoButton" type="button" title="Redo (Ctrl+Y / Ctrl+Shift+Z)" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9h-9.5A6.5 6.5 0 0 0 4 15.5V17"></path></svg>
          </button>
        </div>
        <div class="control-cluster">
          <button class="icon-button" id="zoomOutButton" type="button" title="Zoom out (-)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
          </button>
          <button class="zoom-level" id="zoomLevelButton" type="button" title="Reset zoom to 100%">100%</button>
          <button class="icon-button" id="zoomInButton" type="button" title="Zoom in (+)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
          <button class="text-button" id="fitButton" type="button" title="Fit image to window (0)">Fit</button>
        </div>
        <button class="button button-secondary" id="suggestionsButton" type="button" hidden>Suggested Redactions (0)</button>
        <button class="button button-ghost" id="cancelButton" type="button">Cancel</button>
        <button class="button button-primary" id="saveButton" type="button">Save</button>
      </div>
    </header>
    <div class="props" id="propsBar">
      <div class="prop-group" id="colorGroup">
        <span class="prop-label">Color</span>
        <div class="swatches" id="swatches"></div>
        <input type="color" id="colorInput" class="color-input" value="#d97706" title="Custom color">
      </div>
      <div class="prop-group" id="strokeGroup">
        <span class="prop-label">Stroke</span>
        <input type="range" id="strokeInput" min="1" max="20" step="1" value="4" title="Stroke width">
        <span class="prop-value" id="strokeValue">4</span>
      </div>
      <div class="prop-group" id="fontGroup">
        <span class="prop-label">Font size</span>
        <input type="range" id="fontInput" min="10" max="72" step="1" value="18" title="Font size">
        <span class="prop-value" id="fontValue">18</span>
      </div>
      <div class="prop-group" id="pixelateGroup" hidden>
        <span class="prop-label">Block</span>
        <input type="range" id="pixelateInput" min="4" max="60" step="1" value="12" title="Mosaic block size">
        <span class="prop-value" id="pixelateValue">12</span>
      </div>
      <div class="prop-group" id="glyphGroup" hidden>
        <span class="prop-label">Glyph</span>
        <div class="glyph-buttons" id="glyphButtons"></div>
      </div>
      <div class="prop-group" id="backingGroup" hidden>
        <span class="prop-label">Backing</span>
      </div>
      <div class="prop-group" id="cropGroup" hidden>
        <button class="button button-primary small-button" id="applyCropButton" type="button">Apply Crop</button>
        <button class="button button-secondary small-button" id="clearCropButton" type="button">Clear</button>
        <span class="prop-value" id="cropSizeLabel"></span>
      </div>
      <span class="prop-hint" id="propHint"></span>
    </div>
    <div class="main">
      <nav class="toolbar" id="toolbar" aria-label="Annotation tools">
        <button class="tool-button" type="button" data-tool="select" title="Select (V)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12.5 10.4-5.6.9 3 5.8-2.7 1.4-3-5.9L6 19z" fill="currentColor"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="pan" title="Pan (hold Space, or middle-drag)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path><path d="M9.5 6.5L12 4l2.5 2.5M9.5 17.5L12 20l2.5-2.5M6.5 9.5L4 12l2.5 2.5M17.5 9.5L20 12l-2.5 2.5"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="crop" title="Crop (X)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v13a2 2 0 0 0 2 2h13"></path><path d="M2 7h13a2 2 0 0 1 2 2v13"></path></svg>
        </button>
        <span class="tool-divider" role="presentation"></span>
        <button class="tool-button" type="button" data-tool="arrow" title="Arrow (A)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L18 6"></path><path d="M10.5 5.5H18.5V13.5"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="line" title="Line (L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 19L19 5"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="box" title="Box (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2"></rect></svg>
        </button>
        <button class="tool-button" type="button" data-tool="ellipse" title="Ellipse (E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"></ellipse></svg>
        </button>
        <button class="tool-button" type="button" data-tool="pen" title="Pen (P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="highlight" title="Highlight (H)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-8.5 8.5h-4L5 16z"></path><path d="M3 21h9"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="text" title="Text (T)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6h12M12 6v13M9.5 19h5"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="callout" title="Callout (C)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-7l-4.5 4.5V15H6a2 2 0 0 1-2-2z"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="badge" title="Badge (N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" stroke="none">1</text></svg>
        </button>
        <button class="tool-button" type="button" data-tool="stamp" title="Stamp (M)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4 4L19 6.5"></path></svg>
        </button>
        <button class="tool-button" type="button" data-tool="redact" title="Redact (D)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect></svg>
        </button>
        <button class="tool-button" type="button" data-tool="pixelate" title="Pixelate (Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="4" y="4" width="5" height="5"></rect><rect x="14" y="4" width="5" height="5"></rect><rect x="9" y="9" width="5" height="5"></rect><rect x="4" y="14" width="5" height="5"></rect><rect x="14" y="14" width="5" height="5"></rect></g></svg>
        </button>
      </nav>
      <div class="workspace" id="workspace">
        <canvas id="stage"></canvas>
        <div class="overlay-layer" id="overlayLayer"></div>
        <div class="drop-zone" id="dropZone" hidden>
          <div class="drop-card">
            <p class="eyebrow">Dev Mode</p>
            <h2>Load a test image</h2>
            <p class="subtle small">Choose a file or drop an image anywhere in this window.</p>
            <input type="file" id="devFileInput" accept="image/*">
          </div>
        </div>
      </div>
    </div>
    <div class="suggestions-popover" id="suggestionsPopover" hidden>
      <p class="popover-title">Suggested redactions</p>
      <ul class="suggestions-list" id="suggestionsList"></ul>
      <div class="popover-actions">
        <button class="button button-primary small-button" id="applySuggestionsButton" type="button">Apply All</button>
        <button class="button button-secondary small-button" id="hideSuggestionsButton" type="button">Hide</button>
      </div>
    </div>
    <div class="status-toast" id="statusToast" hidden></div>
    <div class="error-state" id="errorState" hidden>
      <div class="error-card">
        <p class="eyebrow">Heracles &bull; Editor</p>
        <h2 id="errorTitle">Session not found</h2>
        <p class="subtle" id="errorMessage"></p>
        <button class="button button-secondary" id="errorCloseButton" type="button">Close Tab</button>
      </div>
    </div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
